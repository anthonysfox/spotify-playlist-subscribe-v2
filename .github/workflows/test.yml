name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads this to load the Prisma config, even though
      # `prisma generate` (run via postinstall) never connects to a database.
      POSTGRES_URL_NON_POOLING: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: playlistfox_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d playlistfox_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    env:
      # Same credentials/port as docker-compose.yml, so the test:db:migrate
      # and test:integration scripts work unchanged here and locally.
      POSTGRES_URL_NON_POOLING: "postgresql://test:test@localhost:5433/playlistfox_test"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:db:migrate

      - run: pnpm test:integration
