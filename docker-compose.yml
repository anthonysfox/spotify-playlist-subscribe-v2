services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: playlistfox_test
    ports:
      # 5433, not 5432 — avoids clashing with a local/dev Postgres already
      # using the default port.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d playlistfox_test"]
      interval: 2s
      timeout: 3s
      retries: 10
    # No volume on purpose — this database only ever holds throwaway test
    # data. Ephemeral by default: `docker compose down` wipes it clean, which
    # is what you want between test runs.
    tmpfs:
      - /var/lib/postgresql/data
